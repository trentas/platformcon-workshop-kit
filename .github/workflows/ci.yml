name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Estações 1 e 2 (Node 22.18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18" # o mínimo que o README pede
          cache: npm
      - run: npm ci
      - name: Guardas da estação 2
        run: make guardas
      - name: Tipos
        run: npx tsc --noEmit
      - name: Fumaça da estação 1 (servidor, simulador, troca de versão, avaliador sem modelo)
        run: make fumaca

  go:
    name: Estação 3 (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: make build
      - run: bash -n preflight.sh

  # O preflight de verdade, numa VM amd64 limpa: baixa o ptop da release, aplica as
  # capabilities com sudo e faz a captura de teste de 5 s.
  preflight:
    name: Preflight (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make preflight
      - name: Coletores
        if: always()
        run: test -x bin/ptop && ./bin/ptop --caps || true

  # O mesmo preflight sem Go no PATH: as ferramentas vêm dos pacotes que a
  # release publica, servidos localmente.
  preflight-sem-go:
    name: Preflight sem Go (amd64, ferramentas do pacote)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make pacotes
      - name: Preflight sem Go, com os pacotes servidos em localhost
        run: |
          (cd dist && exec python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi go | paste -sd:)"
          # A imagem do runner também traz um Go em /usr/bin; a VM é descartável.
          while command -v go > /dev/null; do sudo mv "$(command -v go)" "$(mktemp -u /tmp/go-oculto-XXXX)"; hash -r; done
          if command -v go; then echo "o Go ainda está no PATH: o teste não vale"; exit 1; fi
          for i in $(seq 20); do curl -sf http://127.0.0.1:8765/SHA256SUMS > /dev/null && break; sleep 0.5; done
          rm -rf bin
          KIT_BINARIOS_URL=http://127.0.0.1:8765 make preflight
          grep -q 'ferramentas=release' preflight-resultado.txt

  # Só sob demanda: a estação 3 inteira numa VM amd64 limpa, com as capturas como
  # artefato. É daqui que podem sair as capturas de reserva de amd64.
  capturas:
    name: Estação 3 completa (amd64, sob demanda)
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make preflight
      - name: Capturas v1, v2 e v1 de novo
        run: |
          for c in v1:v1-a v2:v2 v1:v1-b; do
            make -s subir VERSAO=${c%%:*}
            sleep 5
            make captura NOME=${c##*:} DURACAO=30
          done
          make parar
      - name: Comparações
        run: |
          make comparar A=v1-a B=v2 | tee capturas/comparar-v1-a-v2.txt
          make comparar A=v1-a B=v1-b | tee capturas/comparar-v1-a-v1-b.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas-amd64
          path: capturas/
